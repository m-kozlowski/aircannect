name: Pages

on:
  workflow_run:
    workflows: [firmware]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Assemble site from the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          gh release download "$tag" --pattern '*-initial.zip' --dir "$RUNNER_TEMP/release"

          package=$(npm pack --silent --ignore-scripts esp-web-tools@10.5.2 --pack-destination "$RUNNER_TEMP")
          tar -xzf "$RUNNER_TEMP/$package" -C "$RUNNER_TEMP"

          python3 -m venv "$RUNNER_TEMP/pages-venv"
          "$RUNNER_TEMP/pages-venv/bin/pip" install markdown-it-py==3.0.0
          "$RUNNER_TEMP/pages-venv/bin/python" python/tools/build_pages.py \
            --tag "$tag" --release-dir "$RUNNER_TEMP/release" \
            --esp-web-tools "$RUNNER_TEMP/package" --output _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
