[platformio]
src_dir = src
include_dir = include
test_dir = test
build_cache_dir = .pio/build-cache
extra_configs =
    platformio-ota.ini
    platformio-private*.ini
default_envs =
    xiao-esp32s3-plus-sdmmc4

[env]
build_unflags =
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson@7.4.3
    liux-pro/lz4@0.0.2
    tobozo/ESP32-targz@1.3.1

lib_extra_dirs =
    .pio/generated-libs

build_flags =
    -std=gnu++17
    -Werror=frame-larger-than=3072
    -DAC_CAN_TX_ID=0x383
    -DAC_CAN_RX_ID=0x382
    -DAC_CAN_LOG_ID=0x796
    -DAC_CAN_BOOT_ID=0x2c8
    -DAC_AS11_SERVICE_TX_ID=0x3c1
    -DAC_AS11_SERVICE_RX_ID=0x3c0
    -DAC_CAN_BITRATE=1000000
    -DAC_TCP_BRIDGE_PORT=39011
    -DAC_SERIAL_BAUD=921600
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192

[aircannect-esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
extra_scripts =
    pre:generate_libsmb2.py
    pre:generate_version_info.py
    pre:generate_web_ui.py
    post:python/tools/generate_initial_image.py
lib_deps =
    ${env.lib_deps}
    ESP32Async/AsyncTCP@3.4.10
    ESP32Async/ESPAsyncWebServer@3.11.0
    h2zero/NimBLE-Arduino@2.5.0
monitor_speed = 921600
monitor_eol = LF
monitor_filters = send_on_enter
monitor_echo = yes
upload_speed = 921600

[env:xiao-esp32s3-plus]
extends = aircannect-esp32s3
board = seeed_xiao_esp32s3
board_build.variant = XIAO_ESP32S3_Plus
board_build.partitions = partitions_8mb.csv
build_flags =
    ${env.build_flags}
    -DAC_CAN_TX_GPIO=1
    -DAC_CAN_RX_GPIO=2
    -DAC_CAN_TIMING=AC_CAN_TIMING_20TQ_SP80

[env:waveshare-esp32s3-touch-lcd-1-54]
extends = aircannect-esp32s3
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions_16mb.csv
lib_deps =
    ${aircannect-esp32s3.lib_deps}
    moononournation/GFX Library for Arduino@1.6.5
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAC_CAN_ENABLED=0
    -DAC_DISPLAY_DRIVER=AC_DISPLAY_DRIVER_ST7789
    -DAC_DISPLAY_BACKLIGHT_GPIO=46
    -DAC_DISPLAY_DC_GPIO=45
    -DAC_DISPLAY_CS_GPIO=21
    -DAC_DISPLAY_SCK_GPIO=38
    -DAC_DISPLAY_MOSI_GPIO=39
    -DAC_DISPLAY_RESET_GPIO=40
    -DAC_DISPLAY_WIDTH=240
    -DAC_DISPLAY_HEIGHT=240
    -DAC_MOTION_DRIVER=AC_MOTION_DRIVER_QMI8658
    -DAC_MOTION_I2C_SDA_GPIO=42
    -DAC_MOTION_I2C_SCL_GPIO=41
    -DAC_MOTION_POLL_MS=40
    -DAC_DISPLAY_TASK_PRIO=1
    -DAC_ACTION_BUTTON_GPIO=4
    -DAC_STORAGE_SDMMC_ENABLED=1
    -DAC_STORAGE_MAX_OPEN_FILES=8
    -DAC_SDMMC_WIDTH=4
    -DAC_SDMMC_CLK_GPIO=16
    -DAC_SDMMC_CMD_GPIO=15
    -DAC_SDMMC_D0_GPIO=17
    -DAC_SDMMC_D1_GPIO=18
    -DAC_SDMMC_D2_GPIO=13
    -DAC_SDMMC_D3_GPIO=14
    -DAC_SDMMC_FREQ_KHZ=40000
    -DAC_OTA_RELEASE_TARGET=\"waveshare-esp32s3-touch-lcd-1-54\"


[env:xiao-esp32s3-plus-sdmmc1]
extends = env:xiao-esp32s3-plus
lib_ignore =
build_flags =
    ${env.build_flags}
    -DAC_CAN_TX_GPIO=1
    -DAC_CAN_RX_GPIO=2
    -DAC_CAN_TIMING=AC_CAN_TIMING_20TQ_SP80
    -DAC_STORAGE_SDMMC_ENABLED=1
    -DAC_STORAGE_MAX_OPEN_FILES=8
    -DAC_SDMMC_WIDTH=1
    -DAC_SDMMC_CLK_GPIO=13
    -DAC_SDMMC_CMD_GPIO=11
    -DAC_SDMMC_D0_GPIO=12
    -DAC_SDMMC_FREQ_KHZ=40000

[env:xiao-esp32s3-plus-sdmmc4]
extends = env:xiao-esp32s3-plus
lib_ignore =
build_flags =
    ${env.build_flags}
    -DAC_CAN_TX_GPIO=1
    -DAC_CAN_RX_GPIO=2
    -DAC_CAN_TIMING=AC_CAN_TIMING_20TQ_SP80
    -DAC_STORAGE_SDMMC_ENABLED=1
    -DAC_STORAGE_MAX_OPEN_FILES=8
    -DAC_SDMMC_WIDTH=4
    -DAC_SDMMC_CLK_GPIO=13
    -DAC_SDMMC_CMD_GPIO=11
    -DAC_SDMMC_D0_GPIO=12
    -DAC_SDMMC_D1_GPIO=38
    -DAC_SDMMC_D2_GPIO=39
    -DAC_SDMMC_D3_GPIO=40
    -DAC_SDMMC_FREQ_KHZ=40000

[env:xiao-esp32s3-plus-spisd]
extends = env:xiao-esp32s3-plus
lib_ignore =
build_flags =
    ${env.build_flags}
    -DAC_CAN_TX_GPIO=1
    -DAC_CAN_RX_GPIO=2
    -DAC_CAN_TIMING=AC_CAN_TIMING_20TQ_SP80
    -DAC_STORAGE_SPI_SD_ENABLED=1
    -DAC_STORAGE_MAX_OPEN_FILES=8
    -DAC_SPI_SD_CS_GPIO=10
    -DAC_SPI_SD_SCK_GPIO=13
    -DAC_SPI_SD_MISO_GPIO=12
    -DAC_SPI_SD_MOSI_GPIO=11
